[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetic_models"
version = "0.1.3"
description = "Tight-binding implementation of 2D topological insulators coupled to magnetic layers."
readme = "README.md"
authors = [
  { name = "Laszlo Erik Fritsch", email = "fryc02@outlook.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["tight-binding", "topological insulator", "BHZ", "magnetism", "sisl"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy",
  "scipy",
  "sisl",
  "plotly",
  "matplotlib",
  "ipywidgets",
]

[project.optional-dependencies]
# Extra packages used by the analysis scripts and notebooks of the thesis
analysis = [
  "grogupy",
  "z2pack",
  "mpi4py",
  "tqdm",
  "dill",
  "pandas",
  "seaborn",
  "scikit-learn",
]

[project.urls]
Repository = "https://github.com/fritschicken/diploma"

[tool.setuptools.packages.find]
where = ["src"]
